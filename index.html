<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Noże</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    td, th { border: 1px solid #ccc; padding: 8px; }
    img.thumb { width: 60px; cursor: pointer; margin: 2px; }
    td.images {
                display: flex;
                flex-wrap: wrap; /* zawijanie do kolejnego wiersza jeśli brak miejsca */
                gap: 4px;        /* odstęp między miniaturami */
              }

    /* modal */
    #modal {
      display: none;
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.8);
      justify-content:center;
      align-items:center;
    }
    #modal img {
      max-width: 90%;
      max-height: 90%;
    }
  </style>
</head>
<body>

<h1>Tabela</h1>
<table id="tabela"></table>

<div id="modal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSZO3-GUWNEOAn87B-zEbtVy0SAuj3HTHHz6YOH_EwA6G0s-jkKaMRv9WAQLaTcM0dQBkANW4x3lv1l/pub?gid=94570365&single=true&output=csv";

fetch(sheetURL)
  .then(res => res.text())
  .then(csv => {
    const rows = csv.split("\n").map(r => r.split(","));
    const table = document.getElementById("tabela");

    rows.forEach((row, i) => {
      const tr = document.createElement("tr");

      row.forEach(cell => {
        const td = document.createElement(i === 0 ? "th" : "td");
        td.textContent = cell;
        tr.appendChild(td);
      });

      // kolumna ze zdjęciami
      if (i !== 0) {
        const index = row[0]; // numer porządkowy
        const td = document.createElement("td");
        td.className = "images";
        const letters = ["", "a", "b", "c", "d", "e"];

        letters.forEach(l => {
          const imgPath = `images/${index}${l}.jpg`;

          const img = new Image();
          img.src = imgPath;
          img.className = "thumb";

          img.onerror = () => img.remove(); // usuń jeśli nie istnieje

          img.onclick = () => {
            document.getElementById("modalImg").src = img.src;
            document.getElementById("modal").style.display = "flex";
          };

          td.appendChild(img);
        });

        tr.appendChild(td);
      }

      table.appendChild(tr);
    });
  });
</script>

</body>
</html>
